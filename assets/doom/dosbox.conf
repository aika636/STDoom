[sdl]
autolock     = false     ; Pointer Lock захватываем сами, из своего кода
usescancodes = true

[dosbox]
machine = svga_s3        ; DOOM живёт в Mode 13h, но пресет эпохи ставит именно это
memsize = 16             ; НЕ поднимать: >64 МБ ломает DOS/4GW 1.95 внутри DOOM

[render]
frameskip = 0            ; аварийный рычаг
aspect    = false        ; коррекцию 4:3 делаем сами, в рендерере
scaler    = none         ; масштабирование — забота GPU

[cpu]
core    = normal         ; dynamic в js-dos недоступен
cputype = auto
cycles  = 20000

[mixer]
rate      = 49716
blocksize = 1024
prebuffer = 20

[midi]
mpu401     = none        ; в браузере не с кем разговаривать
mididevice = none

[sblaster]
sbtype  = sbpro2         ; ровно то, что рекомендовал id Software
sbbase  = 220
irq     = 7
dma     = 1
hdma    = 5
oplmode = opl3
oplemu  = default        ; "nuked" точнее, но для wasm слишком тяжёл
oplrate = 49716

[joystick]
joysticktype = none      ; геймпад разбираем сами

[dos]
xms = true
ems = true
umb = true

[autoexec]
SET DMXOPTION=-opl3
mount c .
c:
DOOM.EXE
